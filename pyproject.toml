[project]
name = "optimized_lssvr"
version = "0.0.3"
description = "Least Squares Support Vector Regression with optimized hyperparameters (deprecated, superseded by optimized-svm)"
readme = "README.md"
requires-python = ">=3.7"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Nico Strasdat", email = "nstrasdat@gmail.com" }
]
classifiers = [
  "Development Status :: 7 - Inactive",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy",
  "scipy",
  "scikit-learn",
]

[project.urls]
Homepage = "https://github.com/wotzlaff/sklearn-optimized-lssvr"
Successor = "https://wotzlaff.github.io/optimized-svm/"
Migration = "https://wotzlaff.github.io/optimized-svm/migration-lssvr/"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
